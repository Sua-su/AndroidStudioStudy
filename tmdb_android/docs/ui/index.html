<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TMRB Android UI Mockup</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .phone { width: 360px; height: 640px; background: white; border: 12px solid #333; border-radius: 36px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .status-bar { height: 24px; background: #eee; }
        .top-bar { height: 56px; background: #6750A4; color: white; display: flex; align-items: center; padding: 0 16px; font-weight: bold; }
        .content { flex: 1; overflow-y: auto; padding: 8px; }
        .bottom-nav { height: 80px; background: #f3edf7; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { text-align: center; font-size: 12px; color: #49454F; }
        .nav-item.active { color: #6750A4; font-weight: bold; }
        .movie-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .movie-card { background: #fff; border-radius: 8px; border: 1px solid #ddd; overflow: hidden; }
        .movie-poster { width: 100%; height: 180px; background: #ccc; }
        .movie-info { padding: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>TMRB Android UI Mockups</h1>
    
    <h3>Home Screen</h3>
    <div class="phone">
        <div class="status-bar"></div>
        <div class="top-bar">TMRB Movies</div>
        <div class="content">
            <div class="movie-grid">
                <div class="movie-card"><div class="movie-poster"></div><div class="movie-info">Movie Title 1</div></div>
                <div class="movie-card"><div class="movie-poster"></div><div class="movie-info">Movie Title 2</div></div>
                <div class="movie-card"><div class="movie-poster"></div><div class="movie-info">Movie Title 3</div></div>
                <div class="movie-card"><div class="movie-poster"></div><div class="movie-info">Movie Title 4</div></div>
            </div>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active">Home</div>
            <div class="nav-item">Search</div>
            <div class="nav-item">Reviews</div>
        </div>
    </div>

    <h3>Search Screen</h3>
    <div class="phone">
        <div class="status-bar"></div>
        <div class="top-bar" style="background: white; color: #333; border-bottom: 1px solid #ddd;">
            <input type="text" placeholder="Search movies..." style="width: 100%; border: none; font-size: 16px; outline: none;">
        </div>
        <div class="content">
            <p style="color: #666; text-align: center; margin-top: 100px;">Search for your favorite movies</p>
        </div>
        <div class="bottom-nav">
            <div class="nav-item">Home</div>
            <div class="nav-item active">Search</div>
            <div class="nav-item">Reviews</div>
        </div>
    </div>
</body>
</html>
